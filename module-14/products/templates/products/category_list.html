{% extends 'products/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Categories</h1>
    <a href="/categories/add/" class="btn btn-success">+ Add Category</a>
</div>

<div class="row">
    {% for category in categories %}
    <div class="col-md-4 mb-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ category.name }}</h5>
                <p class="card-text">{{ category.description }}</p>
                <p class="card-text">
                    <strong>Products:</strong> {{ category.product_count }}
                </p>
                <a href="/categories/{{ category.id }}/edit/" class="btn btn-warning btn-sm">Edit</a>
                <a href="/categories/{{ category.id }}/delete/" class="btn btn-danger btn-sm">Delete</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
